
<main class="mx-auto flex min-h-screen max-w-3xl flex-col items-start justify-center gap-6 p-8">
  @if (loading()) {
    <p class="flex items-center gap-4 ">Chargement <z-spinner class="size-6"/></p>
  } @else {
    <h1 class="text-4xl font-semibold">Party: {{ party()?.name }}</h1>
    <p class="text-muted-foreground">Share the QR Code to let your friends join you</p>
    <div [innerHTML]="qrcode()" class="size-60"></div>
    <div class="flex items-center gap-3">
      <a z-button routerLink="">Home</a>
      <a z-button routerLink="/party">Next step</a>
    </div>
  }
</main>
