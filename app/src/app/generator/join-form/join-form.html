<main class="mx-auto flex min-h-screen max-w-3xl flex-col items-start justify-center gap-6 p-8">
  <z-card class="w-full md:w-94 mx-auto">
    <z-card-header>
      <h3 class="text-4xl cols-span-full">Join party</h3>
    </z-card-header>
    <z-card-content>
      <form [formGroup]="form" class="grid grid-cols-2 gap-x-2 gap-y-6">
        <div z-field class="col-span-full">
          <label z-field-label for="party_id">Party id</label>
          <input z-input id="party_id" type="text" placeholder="DJNKJFHYKIUS" formControlName="party_id" />
        </div>
        <a z-button class="justify-self-start" zSize="lg" zType="outline" routerLink="/">Back</a>
        <button z-button class="justify-self-end" zSize="lg" [zLoading]="loading()" [zDisabled]="loading()" (click)="onSubmit()">Join the party</button>
      </form>
    </z-card-content>
  </z-card>
</main>
