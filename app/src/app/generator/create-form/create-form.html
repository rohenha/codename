<main class="mx-auto flex min-h-screen max-w-3xl flex-col items-start justify-center gap-6 p-8">
  <z-card class="w-full md:w-94 mx-auto">
    <z-card-header>
      <h3 class="text-4xl cols-span-full">Create a party</h3>
    </z-card-header>
    <z-card-content>
      <form [formGroup]="form" class="grid grid-cols-2 gap-x-2 gap-y-6">
        <div z-field class="col-span-full">
          <label z-field-label for="name">Party name</label>
          <input z-input id="name" type="text" placeholder="Friends party" formControlName="name" />
        </div>
        <div z-field class="col-span-full">
          <label z-field-label for="players">Number of players</label>
          <input z-input id="players" type="number" placeholder="1" formControlName="players"/>
        </div>
        <div z-field class="col-span-full">
          <label z-field-label for="themes">Themes</label>
          <z-select zPlaceholder="Themes" [zMultiple]="true" [zMaxLabelCount]="3" formControlName="themes">
            @for (option of options(); track option.id) {
              <z-select-item [zValue]="option.id">{{ option.label }}</z-select-item>
            }
          </z-select>
        </div>
        <a z-button class="justify-self-start" zSize="lg" zType="outline" routerLink="/">Back</a>
        <button z-button
        class="justify-self-end" zSize="lg" [zLoading]="loading()" [zDisabled]="loading()" (click)="onSubmit()">Create the party</button>
      </form>
    </z-card-content>
  </z-card>
</main>
