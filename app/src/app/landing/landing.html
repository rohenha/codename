<main class="mx-auto flex min-h-screen max-w-3xl flex-col items-start justify-center gap-6 p-8">
  <h1 class="text-4xl font-semibold">Codename game</h1>
  <p class="text-muted-foreground">Angular 21 with Zard UI, backed by an AdonisJS REST API.</p>
  <div class="flex items-center gap-3">
    <a z-button routerLink="/create">Create party</a>
    <a z-button routerLink="/join">Join party</a>
  </div>
  @if (parties()) {
    <div class="grid gap-2 w-full mt-6">
      <h2 class="text-2xl mb-2">My parties</h2>
      @for (party of parties(); track party.uuid) {
        <div class="flex justify-between items-center gap-3 py-4 px-4 rounded-xl border-accent border">
          <h3 class="text-md">{{ party.name }}</h3> <a z-button [routerLink]="`party/${party.uuid}`">See party</a>
        </div>
        <!-- <z-card>
          <z-card-header>
            <h3 class="text-4xl cols-span-full">{{ party.name }}</h3>
          </z-card-header>
          <z-card-footer>
            <a z-button [routerLink]="`party/${party.uuid}`">See</a>
          </z-card-footer>
        </z-card> -->
      }
    </div>
  }
</main>
