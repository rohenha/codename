<div class="grid gap-2 w-full mt-6">
  <header class="flex items-center justify-between gap-2">
    <h2 class="text-2xl font-semibold mb-2">My parties</h2>
    <a z-button routerLink="/party/create">Create party</a>
  </header>
  @if (loading()) {
      <app-party-card-skeleton/>
    } @else {
      @if (parties().length > 0) {
        @for (party of parties(); track party.uuid) {
          <app-party-card [party]="party" />
        }
      } @else {
        <p class="text-base">No parties found</p>
      }
    }
  </div>
